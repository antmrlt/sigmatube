name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Every build gets its own version: versionCode grows with each run so a new APK
      # always installs over the previous one.
      - name: Compute version
        run: echo "VERSION=0.3.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-configuration-cache \
            -PversionCode=${{ github.run_number }} -PversionName=$VERSION

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk SigmaTube.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SigmaTube-apk
          path: SigmaTube.apk

      # One release per push to main (not for pull requests).
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: SigmaTube ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: SigmaTube.apk
          generate_release_notes: true
          make_latest: true
